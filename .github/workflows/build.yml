name: C2ME Build Script

on: [ workflow_dispatch ]

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 1
        submodules: true

    - name: Set up JDK 25
      uses: actions/setup-java@main
      with:
        distribution: 'temurin'
        java-version: 25

    - name: Install LLVM
      uses: KyleMayes/install-llvm-action@master
      with:
        version: "22.1.7"
        force-url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.7/LLVM-22.1.7-Linux-X64.tar.xz"
        directory: ${{ runner.temp }}/llvm

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@main
      with:
        cache-read-only: false
        cache-cleanup: never

    - name: Build C2ME
      run: |
        ./gradlew clean build --stacktrace

    - name: Upload Artifact
      uses: actions/upload-artifact@main
      with:
        name: c2me-artifact
        path: 'build/libs/*.jar'
      
